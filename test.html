<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="660" height="600"></canvas>
  </div>
  <div id="panel">
    <button id="btnPanel" title="Paneli kapat">&#9654;</button>
    <div class="rail-label">PAZAR</div>
    <div class="stat-row">
      <div class="stat">
        <canvas class="icon" id="icoChicken" width="16" height="16"></canvas>
        <b id="stChickens">1</b>
      </div>
      <div class="stat money">
        <canvas class="icon" id="icoCoin" width="16" height="16"></canvas>
        <b id="stMoney">0</b>
        <small id="stRate">+$0/sn</small>
      </div>
      <button id="btnSettings" title="Ayarlar">&#9881;</button>
    </div>
    <div class="res-row">
      <div class="res feed"><span>YEM</span><div class="bar"><i id="barFeed"></i></div><b id="pctFeed">%100</b></div>
      <div class="res water"><span>SU</span><div class="bar"><i id="barWater"></i></div><b id="pctWater">%100</b></div>
    </div>
    <div class="pazar">Pazar</div>
    <div class="tabs">
      <button class="tab active" data-tab="shop">ÇİFTLİK</button>
      <button class="tab" data-tab="stats">İSTATİSTİK</button>
      <button class="tab" data-tab="achv">BAŞARIM</button>
      <button class="tab tab-prest" data-tab="prest">EFSANE</button>
    </div>
    <div id="tabShop">
      <div id="questBar" class="hidden"></div>
      <div class="qtyrow">
        <span>Satın al</span>
        <button id="btnAvail" title="Sadece alınabilirleri göster">Alınabilir</button>
        <button id="btnQty">1x</button>
      </div>
      <div id="cards"></div>
    </div>
    <div id="tabStats" class="hidden">
      <div id="statList"></div>
    </div>
    <div id="tabAchv" class="hidden">
      <div id="achvList"></div>
    </div>
    <div id="tabPrest" class="hidden">
      <div id="prestBody"></div>
      <button id="btnPrest" class="btn-prest" disabled>PRESTİJ</button>
    </div>
    <div id="sellHint">Tavuğu satmak için buraya sürükle!</div>
    <div id="toast"></div>
    <div class="foot">
      <span id="stEggsSold">⏱ 00:00</span>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
<script>
setTimeout(() => {
  const out = document.createElement('pre');
  out.id = 'testout';
  try {
    const { S, update, SHOP, buyItem, magnet, L } = window.GAME;
    S.muted = true;
    localStorage.clear();
    const log = [];
    for (let i = 0; i < 2400; i++) update(0.05);           // 120 sn (bantlar yok)
    log.push({ t: 120, money: Math.round(S.money), sold: S.eggsSold,
               chickens: S.chickens.length, eggsLive: S.eggs.length,
               onBelt: S.eggs.filter(e => e.phase === 'belt1').length });
    // mıknatıs testi: duran banttaki yumurtayı kap
    let magnetGrabbed = 0;
    const beltEgg = S.eggs.find(e => e.phase === 'belt1');
    if (beltEgg) {
      magnet.active = true;
      magnet.x = beltEgg.x; magnet.y = beltEgg.y + 10;
      for (let i = 0; i < 30; i++) update(0.05);
      magnetGrabbed = magnet.held.length;
      magnet.active = false;
      for (const e of magnet.held) e.phase = 'belt1';
      magnet.held = [];
    }
    log.push({ magnetGrabbed });
    // otomatik besleme: imleç kutu üstündeyken tutulan yumurta satılır
    const af0 = S.eggsSold, m0 = S.money, e0 = S.stats.earned;
    S.eggs.push({ x: L.WD.mouthX, y: L.BELT2_Y, vy: 0, phase: 'floor',
                  tier: 'normal', valMult: 1, clean: false, wash: 0, washM: 0,
                  polish: 0, shine: false, graded: true, seed: 1, sq: 0, rot: 0 });
    magnet.active = true; magnet.x = L.WD.mouthX; magnet.y = L.BELT2_Y + 16;
    for (let i = 0; i < 80; i++) update(0.05);
    log.push({ autoFed: S.eggsSold > af0 && S.money > m0 && S.stats.earned > e0,
               heldLeft: magnet.held.length });
    magnet.active = false;
    for (const e of magnet.held) e.phase = 'belt1';
    magnet.held = [];
    for (const e of S.eggs) if (e.phase === 'pulled' || e.phase === 'held') e.phase = 'belt1';
    // kilit şartlarını sağla: satış sayısı + sürü (cins/horoz kapıları)
    S.eggsSold = 400;
    while (S.chickens.length < 15) window.GAME.spawnChicken();
    S.money = 20000;
    for (const item of SHOP) buyItem(item);
    for (let i = 0; i < 1200; i++) update(0.05);           // +60 sn
    log.push({ t: 180, money: Math.round(S.money), sold: S.eggsSold,
               chickens: S.chickens.length, eggsLive: S.eggs.length,
               lvl: S.lvl, stats: S.stats });
    // panel kontrolleri: eski kart kalmamalı, toplu alım çalışmalı
    const names = [...document.querySelectorAll('#cards .name')].map(e => e.textContent);
    const qtyBtn = document.getElementById('btnQty');
    qtyBtn.click(); // 10x
    S.money = 100000;
    const before = S.lvl.value;
    const valCard = [...document.querySelectorAll('#cards .card')]
      .find(c => c.querySelector('.name').textContent === 'Yumurta Değeri');
    valCard.click();
    qtyBtn.click(); // MAX
    document.querySelector('.tab[data-tab="stats"]').click();
    const statRows = document.querySelectorAll('#statList .srow').length;
    log.push({ names, bulkBought: S.lvl.value - before,
               statsTabRows: statRows,
               machineCardGone: !names.some(n => n.includes('Makine')) });
    // civciv: horoz spawn → 40 sn bekle → civciv çıkmalı
    window.GAME.spawnChicken(undefined, undefined, 'rooster');
    for (let i = 0; i < 800; i++) update(0.05);
    log.push({ chicks: S.chicks.length });
    // geçiş yıkaması: washS maksdayken hiçbir yumurta durup beklememeli (e.wash>0 olmamalı)
    S.lvl.washS = 8;
    for (let i = 0; i < 40; i++) update(0.05); // seviye atanmadan önce yıkananlar bitsin
    let sawStop = false;
    for (let i = 0; i < 600; i++) { update(0.05); if (S.eggs.some(e => e.wash > 0)) sawStop = true; }
    log.push({ washThruOk: !sawStop, washedTotal: S.stats.washed });
    // sınıflandırıcı: %40 şansla (Sv.5) 30 sn'de katman yükseltme olmalı
    const upgBefore = S.stats.upg;
    S.lvl.grade = 5;
    for (let i = 0; i < 600; i++) update(0.05);
    log.push({ graded: S.stats.upg - upgBefore });
    // lojistik: yere yumurta at + kamyon seviyesi → gelip toplayıp satmalı
    S.lvl.truck = 2;
    const moneyBefore = S.money;
    for (let i = 0; i < 6; i++)
      S.eggs.push({ x: L.FX + 200 + i * 30, y: L.FLOOR_Y - 10, vy: 0, phase: 'floor',
                    tier: 'normal', valMult: 1, clean: false, wash: 0, polish: 0,
                    shine: false, graded: true });
    for (let i = 0; i < 2400; i++) update(0.05); // kamyon gelir, yükler, gider
    log.push({ trucked: S.stats.trucked, truckPaid: S.money > moneyBefore,
               floorLeft: S.eggs.filter(e => e.phase === 'floor').length });
    // ---- gübre zinciri: yığın → kürek tık → kova → 20'de çuval → kamyon satışı ----
    // (kamyon bu bölümde durur — stok çuvalı alıp sayacı bozmasın diye)
    const truckLvlSav = S.lvl.truck; S.truck = null; S.truckOff = true;
    const pilesBefore = S.manures.length;
    const manBefore = S.stats.manure;
    const binBefore = S.manureBin;
    if (!S.manures.length) S.manures.push({ x: 300, y: 300, seed: 1 }); // tıklanacak yığın garanti
    window.GAME.collectManure(S.manures[0]); // elle toplama → kovaya
    const clickedToBin = S.stats.manure === manBefore + 1 && S.manureBin === binBefore + 1;
    // 20 yığın = 1 çuval dönüşümü (kepçe kovaya doldurur)
    S.manureBin = 0; S.manures.length = 0;
    for (let i = 0; i < 20; i++) S.manures.push({ x: 120 + i * 6, y: 300, seed: i });
    S.lvl.scoop = Math.max(S.lvl.scoop, 1);
    const bagsBefore = S.manureBags;
    for (let i = 0; i < 900 && S.manureBags === bagsBefore; i++) update(0.05);
    const bagMade = S.manureBags > bagsBefore;
    // kürek imleci: yığın üstünde sistem imleci 'none' (canvas kürek çizer)
    // (tavuklar öncelikli — imleç 'grab' olmasın diye köşeye alınır)
    S.chickens.forEach(c => { c.x = 90; c.y = 430; });
    S.manures.push({ x: 300, y: 300, seed: 1 });
    window.GAME.cam.x = window.GAME.cam.target = 0; window.GAME.cam.page = 0; // imleç dünya koordinatlı — çiftlikte ol
    const chSav = S.chickens.map(c => ({ c, x: c.x, y: c.y })); // tavuklar noktaya denk gelmesin
    for (const c of S.chickens) { c.x = 30; c.y = 660; }
    const cvEl = document.getElementById('game');
    const rc = cvEl.getBoundingClientRect();
    window.dispatchEvent(new PointerEvent('pointermove', {
      pointerType: 'mouse', isPrimary: true,
      clientX: rc.left + 300 * rc.width / L.W, clientY: rc.top + 300 * rc.height / L.H }));
    const shovelCursor = cvEl.style.cursor === 'none';
    for (const { c, x, y } of chSav) { c.x = x; c.y = y; }
    S.manures.length = 0;
    window.dispatchEvent(new PointerEvent('pointermove', {
      pointerType: 'mouse', isPrimary: true,
      clientX: rc.left + 10, clientY: rc.top + rc.height - 10 }));
    const cursorReset = cvEl.style.cursor !== 'none';
    // kamyon çuval satışı: stok koy → kamyon gelip yükleyip ödesin
    const paidBefore = S.money, soldBagsBefore = S.stats.bags;
    S.truckOff = false; S.lvl.truck = truckLvlSav; S.manureBags = 2;
    for (let i = 0; i < 3000 && S.stats.bags === soldBagsBefore; i++) update(0.05);
    log.push({ manurePiles: pilesBefore, manureMaxOk: pilesBefore <= 14,
               clickedToBin, binCount: S.manureBin, bagMade,
               bagsSold: S.stats.bags - soldBagsBefore, bagPaid: S.money > paidBefore,
               shovelCursor, cursorReset });
    // ---- yeni yükseltmeler: organik / toptancı / tedarik / bereket / pazarlık / seleksiyon ----
    const evBase = window.GAME.eggValue();
    S.lvl.organic = 2; // x1.24 çarpan
    const organicOk = Math.abs(window.GAME.eggValue() / evBase - 1.24) < 0.03;
    S.lvl.organic = 0;
    S.feed = 0; // dolum maliyeti >1 olsun
    const refillBase = window.GAME.refillCost('feed');
    S.lvl.supply = 3; // -%36
    const supplyOk = window.GAME.refillCost('feed') < refillBase;
    S.lvl.supply = 0;
    const sellBase = window.GAME.sellPrice('white');
    S.lvl.bargain = 4; // %50 → %82
    const bargainOk = window.GAME.sellPrice('white') > sellBase;
    S.lvl.bargain = 0;
    const geneOk = window.GAME.chickOdds(0).w === 0.7
      && window.GAME.chickOdds(5).g > 0 && window.GAME.chickOdds(5).w < 0.7;
    const fertOk = Math.abs(window.GAME.fertileRate(2) - 1.6) < 1e-9;
    // toptancı primi: giden kamyon worth × (1 + 0.15·lv) öder
    S.lvl.dealer = 2;
    S.eggs.length = 0; // kutu satışı deltayı bozmasın
    const eBefore = S.stats.earned; // ödüller earned'e dokunmaz — sadece satışlar
    S.truck = { x: L.W + 60, state: 'leave', cargo: 1, bags: 0, worth: 1000, t: 0, bob: 0, tier: 1, dip: 0 };
    for (let i = 0; i < 30; i++) update(0.05);
    const dealerOk = S.stats.earned - eBefore === 1300;
    S.lvl.dealer = 0;
    log.push({ organicOk, supplyOk, bargainOk, geneOk, fertOk, dealerOk });
    // ---- zorluk çarpanları: kolay > standart > zor kazanç; tersine tüketim/fiyat ----
    S.feed = 0;
    S.diff = 'easy';  const vE = window.GAME.eggValue(), cE = window.GAME.consumeMult(), pE = window.GAME.refillCost('feed');
    S.diff = 'xhard'; const vX = window.GAME.eggValue(), cX = window.GAME.consumeMult(), pX = window.GAME.refillCost('feed');
    const diffOk = vE > vX && cE < cX && pE < pX;
    S.diff = 'hard'; window.GAME.writeSave();
    const diffSaved = JSON.parse(localStorage.getItem('tavukciftligi_v1')).diff === 'hard';
    S.diff = 'std';
    log.push({ diffOk, diffSaved });
    // ---- süpürge: kirli yumurta fırçadan geçer, kir gübre kovasına döner ----
    S.lvl.brush = 3;
    const mBefore = S.manureBin, bagsBefore = S.manureBags;
    S.eggs.length = 0;
    S.eggs.push({ x: window.GAME.L.WD.brushX + 40, y: window.GAME.L.BELT1_Y - 16,
      phase: 'belt1', tier: 'normal', valMult: 1, dirt: 1, clean: false,
      wash: 0, polish: 0, shine: false, graded: false, seed: 3, sc: 2, pile: 0 });
    const bEgg = S.eggs[0];
    for (let i = 0; i < 60; i++) update(0.05);
    // kova 20'de çuvala çevrilip sıfırlanabilir — ikisini birden izle
    log.push({ brushOk: bEgg.dirt <= 0.05,
               dirtToManure: S.manureBin > mBefore || S.manureBags > bagsBefore });
    S.lvl.brush = 0;
    // ---- görev zinciri: koşullar sağlandı → sıralı ilerleme ----
    window.GAME.checkQuests();
    const qAfter = S.questIdx;
    S.eggsSold = 600; // 'Yarım Bin' için
    window.GAME.checkQuests();
    log.push({ questIdx: qAfter, questBarShown: !!document.querySelector('#questBar b') });
    // ---- prestij: kazanç → ⭐ → tam sıfırlama ----
    S.stats.earned = 200000; S.prestigeBase = 0; // √ ölçek: sqrt(200000/40000) ≈ 2 ⭐
    document.querySelector('.tab[data-tab="prest"]').click();
    const btn = document.getElementById('btnPrest');
    btn.click(); btn.click(); // iki aşamalı onay
    log.push({ prestige: S.prestige, prestResetOk: S.money === 0 && S.lvl.value === 0
               && S.chickens.length === 1 && S.eggs.length === 0,
               prestTabRows: document.querySelectorAll('#prestBody .srow').length });
    // prestij 'Efsane Ol' görevini tamamlamalı → zincir biter
    window.GAME.checkQuests();
    log.push({ questsDone: S.questIdx >= window.GAME.QUESTS.length,
               questAdvanced: S.questIdx > qAfter || S.questIdx >= window.GAME.QUESTS.length });
    // ---- tilki: tıkla ürküt → kaçar + ödül; taşınan tavuk kurtulur ----
    for (const c of S.chickens) c.stolen = false; // doğal tilki artığı temizle
    const fTarget = S.chickens[0];
    S.fox = { x: window.GAME.L.FX - 150, y: fTarget.y, state: 'sneak',
              t: 0, pause: false, dir: -1, target: fTarget, scare: 0, carry: null };
    const mFox = S.money;
    window.GAME.scareFox();              // oyuncu tıklaması simülasyonu
    const foxFled = S.fox && S.fox.state === 'flee' && S.money > mFox
                    && (S.stats.foxed || 0) === 1;
    for (let i = 0; i < 240 && S.fox; i++) update(0.05); // kaçış süresi
    const foxGone = !S.fox && !fTarget.stolen && S.chickens.includes(fTarget);
    // taşıma kurtarma: kapılmış tavuk tıkla düşürülür
    const f2 = S.chickens[0];
    S.fox = { x: f2.x + 40, y: f2.y, state: 'flee', t: 0, pause: false,
              dir: 1, target: null, scare: 0, carry: f2 };
    f2.stolen = true;
    window.GAME.scareFox();
    const rescued = !f2.stolen && !S.fox.carry && S.chickens.includes(f2);
    for (let i = 0; i < 240 && S.fox; i++) update(0.05);
    log.push({ foxFled, foxGone, rescued });
    // ---- kelebek: tıkla yakala → para + kaybolur ----
    S.butterfly = { x: 300, y: 300, t: 0, seed: 1 };
    const mFly = S.money;
    window.GAME.catchButterfly();
    log.push({ flyCaught: !S.butterfly && S.money > mFly && (S.stats.butter || 0) === 1 });
    // ---- yağmur: consumeMult indirimi uygulanır ----
    const cmDry = window.GAME.consumeMult();
    S.rain = { t: 10 };
    const cmWet = window.GAME.consumeMult();
    S.rain = null;
    log.push({ rainOk: Math.abs(cmWet - cmDry * 0.75) < 1e-9 });

    // ---- kozmetik mağaza: süs satın alımı kayda işlenir ----
    S.money = Math.max(S.money, 1000); // prestij sonrası kasa boş olabilir
    const mDec = S.money, nDec = S.decor.length;
    window.GAME.buyDecor('flowers');
    window.GAME.buyDecor('flowers'); // tekrar alım yok
    log.push({ decorOk: S.decor.includes('flowers') && S.decor.length === nDec + 1
               && S.money === mDec - 150 });

    // ---- çiftlik manzarası: satın alınınca arsaya dikilir + req kilidi ----
    S.money = Math.max(S.money, 5000);
    const mSc = S.money;
    window.GAME.buyDecor('pond');            // 550 — gölet arsasına kurulur
    window.GAME.buyDecor('duck');            // req:pond — gölet alındı, açılır (800)
    log.push({ sceneryOk: S.scenery.pond === 1 && S.decor.includes('duck')
               && S.money === mSc - 550 - 800 });

    // ---- kayıt: prestij/görev alanları kalıcı ----
    window.GAME.writeSave();
    const saved = JSON.parse(localStorage.getItem('tavukciftligi_v1'));
    log.push({ saveOk: saved && saved.prestige === S.prestige
               && saved.questIdx === S.questIdx
               && saved.decor.join() === S.decor.join() });
    out.textContent = 'TEST|' + JSON.stringify(log);
  } catch (e) {
    out.textContent = 'TESTERR|' + e.message + '|' + e.stack;
  }
  document.body.appendChild(out);
}, 800);
</script>
</body>
</html>
