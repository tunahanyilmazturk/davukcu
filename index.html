<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tavuk Çiftliği</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="660" height="600"></canvas>
    <div id="topbar">
      <button class="tb-chip" id="tbTime" title="Oyun istatistikleri"><span class="tb-ico">&#9202;</span><b id="tbTimeV">00:00</b></button>
      <button class="tb-chip" id="tbMode" title="Efsane / prestij"><span id="tbModeV">KLASİK</span></button>
      <span class="tb-gap"></span>
      <button class="tb-chip dim" id="tbVer" title="Ayarlar">v1.0</button>
      <button class="tb-chip" id="tbFps" title="FPS göstergesi aç/kapat"><b id="tbFpsV">60</b><span>FPS</span></button>
      <button class="tb-chip" id="tbExit" title="Ana menüye dön"><span class="tb-ico">&#8962;</span><span>MENÜ</span></button>
    </div>
  </div>
  <div id="panel">
    <button id="btnPanel" title="Paneli kapat">&#9654;</button>
    <div class="rail-label">PAZAR</div>
    <div class="stat-row">
      <div class="stat">
        <canvas class="icon" id="icoChicken" width="16" height="16"></canvas>
        <b id="stChickens">1</b>
      </div>
      <div class="stat money">
        <canvas class="icon" id="icoCoin" width="16" height="16"></canvas>
        <b id="stMoney">0</b>
        <small id="stRate">+$0/sn</small>
      </div>
      <button id="btnSettings" title="Ayarlar">&#9881;</button>
    </div>
    <div class="res-row">
      <div class="res feed" id="resFeed" title="Doldurmak için tıkla (paran yettiği kadar)"><span>YEM</span><div class="bar"><i id="barFeed"></i></div><b id="pctFeed">%100</b></div>
      <div class="res water" id="resWater" title="Doldurmak için tıkla (paran yettiği kadar)"><span>SU</span><div class="bar"><i id="barWater"></i></div><b id="pctWater">%100</b></div>
    </div>
    <div class="pazar" id="tabTitle"><canvas id="tabIco" width="16" height="16"></canvas><span id="tabName">Pazar</span></div>
    <div id="tabBody">
      <div class="trail">
        <button class="tab ticon active" data-tab="shop" title="Çiftlik — üretim ve yükseltmeler"><canvas class="tico" data-ico="chicken" width="16" height="16"></canvas></button>
        <button class="tab ticon" data-tab="market" title="Mağaza — kozmetik süsler"><canvas class="tico" data-ico="cart" width="16" height="16"></canvas></button>
        <button class="tab ticon" data-tab="stats" title="İstatistik"><canvas class="tico" data-ico="chart" width="16" height="16"></canvas></button>
        <button class="tab ticon" data-tab="achv" title="Başarım"><canvas class="tico" data-ico="trophy" width="16" height="16"></canvas></button>
        <button class="tab ticon tab-prest" data-tab="prest" title="Efsane"><canvas class="tico" data-ico="star" width="16" height="16"></canvas></button>
      </div>
      <div id="tabMain">
        <div id="tabShop">
          <div id="questBar" class="hidden"></div>
          <div class="qtyrow">
            <span>Satın al</span>
            <button id="btnAvail" title="Sadece alınabilirleri göster">Alınabilir</button>
            <button id="btnQty">1x</button>
          </div>
          <div id="cards"></div>
        </div>
        <div id="tabMarket" class="hidden">
          <div class="mknote">Çiftliğini geliştir — manzaralar ve süsler satın aldıkça arsalarına eklenir</div>
          <div id="marketCards"></div>
        </div>
        <div id="tabStats" class="hidden">
          <div id="statList"></div>
        </div>
        <div id="tabAchv" class="hidden">
          <div id="achvList"></div>
        </div>
        <div id="tabPrest" class="hidden">
          <div id="prestBody"></div>
          <button id="btnPrest" class="btn-prest" disabled>PRESTİJ</button>
        </div>
      </div>
    </div>
    <div id="sellHint">💰 Tavuk satışı — tavuğu bu panele sürükleyip bırak</div>
    <div id="toast"></div>
    <div class="foot">
      <span class="fchip" id="stPlayTime" title="Oynama süresi">⏱ 00:00</span>
      <span class="fchip" id="stEggsSold" title="Satılan yumurta">🥚 0</span>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
