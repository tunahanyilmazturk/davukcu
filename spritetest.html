<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body { background:#333; } canvas { image-rendering: pixelated; }
</style></head><body>
<canvas id="c" width="800" height="760"></canvas>
<script type="module">
import { SPR, drawSprite } from '/src/sprites/index.js';
const g = document.getElementById('c').getContext('2d');
g.imageSmoothingEnabled = false;
const frames = ['a','b','b2','d','c','e','f'];
let x = 20;
for (const v of ['white','brown','black','gold','rooster']) {
  frames.forEach((f, i) => drawSprite(g, SPR.chickens[v][f], x, 30 + i * 100, 5));
  x += 130;
}
drawSprite(g, SPR.chick.a, 20, 720, 5);
drawSprite(g, SPR.chick.b, 80, 720, 5, true);
drawSprite(g, SPR.chick.c, 140, 720, 5);
</script>
</body></html>
